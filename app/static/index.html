<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Пульт">
<title>Домашний пульт</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" href="/static/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/kit/base.css">
<link rel="stylesheet" href="/static/kit/components.css">
<link rel="stylesheet" href="/static/kit/vendor/uplot/uPlot.min.css">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/kit/vendor/uplot/uPlot.iife.min.js" defer></script>
<script type="module" src="/static/js/main.js"></script>
</head>
<body>
<div id="login" class="login" hidden>
  <form id="login-form" class="card raised login-card stack gap-4">
    <div class="stack gap-1">
      <h1>Домашний пульт</h1>
      <p class="secondary">Введите токен пульта. Он лежит на сервере в <code>~/.config/hub/env</code> (строка <code>HUB_TOKEN=…</code>) или печатается в консоли при запуске.</p>
    </div>
    <div class="field">
      <label for="token">Токен</label>
      <input id="token" class="input" type="password" autocomplete="current-password" required>
    </div>
    <p id="login-error" class="error-text" role="alert"></p>
    <button class="btn block" type="submit">Войти</button>
  </form>
</div>

<div id="app" class="app" hidden>
  <nav id="nav" class="app-nav" aria-label="Разделы"></nav>
  <div class="app-body">
    <header class="app-header">
      <h1 id="page-title">Обзор</h1>
      <span class="spacer"></span>
      <a id="health-pill" class="health-pill" href="#/server" aria-label="Состояние сервера"></a>
      <a class="btn subtle icon-only" href="#/settings" aria-label="Настройки" id="settings-link"></a>
    </header>
    <div id="conn-banner" class="conn-banner" role="status" hidden></div>
    <main id="main" class="app-main" tabindex="-1"></main>
  </div>
</div>
</body>
</html>
